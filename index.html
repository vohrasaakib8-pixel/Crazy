<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Gold Signals</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#07090d;--panel:#0f131a;--line:#1c222c;--text:#e8ebf0;--mute:#8a94a3;--gold:#e0b44c;--up:#26a69a;--down:#ef5350}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Manrope,system-ui,sans-serif;padding:14px;max-width:760px;margin:auto}
h1{font-size:18px;margin:4px 0 12px;font-weight:800}
h1 span{color:var(--gold)}
.call{border-radius:14px;padding:18px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.big{font-size:40px;font-weight:800;line-height:1.1}
.BUY{color:var(--up)}.SELL{color:var(--down)}.WAIT{color:var(--gold)}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.chips{display:flex;gap:8px;margin-top:12px}
.chip{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:13px}
.chip b{display:block;font-size:15px}
.tabs{display:flex;gap:6px;margin:12px 0 8px}
.tabs button{flex:1;background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-weight:600}
.tabs button.on{color:var(--text);border-color:var(--gold)}
#chart{height:420px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.why{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}
.note{color:var(--mute);font-size:12px;margin:14px 2px}
#err{color:var(--down);font-size:13px}
</style></head><body>
<h1>Apex <span>Gold</span> · XAU/USD</h1>
<div class="call">
  <div class="sub">Combined call · <span id="price">…</span></div>
  <div class="big WAIT" id="call">Loading</div>
  <div class="sub" id="why1"></div>
  <div class="chips" id="chips"></div>
  <div id="err"></div>
</div>
<div class="tabs" id="tabs"></div>
<div id="chart"></div>
<div class="why" id="why"></div>
<p class="note">Signals come from four rule-based strategies and describe current conditions. They can't predict the market and some will be wrong. Never risk money you can't afford to lose.</p>
<script>
const TF={'1m':'1min','5m':'5min','15m':'15min','1h':'1h','4h':'4h'};
const grp=k=>(k==='1m'||k==='5m')?['1m','5m','15m']:['15m','1h','4h'];let tf='15m';
const $=s=>document.querySelector(s);
const chart=LightweightCharts.createChart($('#chart'),{autoSize:true,layout:{background:{color:'#000'},textColor:'#8a94a3'},grid:{vertLines:{color:'#12161d'},horzLines:{color:'#12161d'}},timeScale:{timeVisible:true,borderColor:'#222'},rightPriceScale:{borderColor:'#222'}});
const candles=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
const l9=chart.addLineSeries({color:'#e0b44c',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const l21=chart.addLineSeries({color:'#6aa9ff',lineWidth:1,priceLineVisible:false,lastValueVisible:false});

const ema=(v,n)=>{const k=2/(n+1);let p=v[0];return v.map((x,i)=>i?(p=x*k+p*(1-k)):p)};
function rsi(c,n=14){let g=0,l=0;const o=Array(c.length).fill(50);for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],u=Math.max(d,0),w=Math.max(-d,0);if(i<=n){g+=u/n;l+=w/n}else{g=(g*(n-1)+u)/n;l=(l*(n-1)+w)/n}if(i>=n)o[i]=l?100-100/(1+g/l):100}return o}
function bands(c,n=20){return c.map((_,i)=>{if(i<n-1)return null;const s=c.slice(i-n+1,i+1),m=s.reduce((a,b)=>a+b)/n,sd=Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/n);return{u:m+2*sd,l:m-2*sd}})}
const call=s=>s>=2?'BUY':s<=-2?'SELL':'WAIT';

function analyse(d){
  const c=d.map(x=>x.close),e9=ema(c,9),e21=ema(c,21),e12=ema(c,12),e26=ema(c,26);
  const mc=e12.map((x,i)=>x-e26[i]),sg=ema(mc,9),h=mc.map((x,i)=>x-sg[i]),r=rsi(c),b=bands(c);
  const votes=i=>{
    const hp=h[i-1];
    return [
      {n:'Trend (EMA 9/21)',v:e9[i]>e21[i]?1:-1},
      {n:'Momentum (MACD)',v:h[i]>0&&h[i]>hp?1:h[i]<0&&h[i]<hp?-1:0},
      {n:'Reversal (RSI '+r[i].toFixed(0)+')',v:r[i]<35?1:r[i]>65?-1:0},
      {n:'Stretch (Bollinger)',v:c[i]<b[i].l?1:c[i]>b[i].u?-1:0}];
  };
  const sc=d.map((_,i)=>i<30?0:votes(i).reduce((a,x)=>a+x.v,0));
  const marks=[];
  for(let i=31;i<d.length;i++){const p=call(sc[i-1]),q=call(sc[i]);
    if(q!==p&&q!=='WAIT')marks.push(q==='BUY'?{time:d[i].time,position:'belowBar',color:'#26a69a',shape:'arrowUp',text:'BUY'}:{time:d[i].time,position:'aboveBar',color:'#ef5350',shape:'arrowDown',text:'SELL'});}
  const L=d.length-1;
  return {score:sc[L],call:call(sc[L]),votes:votes(L),marks:marks.slice(-40),e9,e21};
}

async function get(tfk){const r=await fetch('/api/candles?interval='+TF[tfk]);const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function run(){
  $('#err').textContent='';
  try{
    const data={},res={},G=grp(tf);
    await Promise.all(G.map(async k=>{data[k]=await get(k);res[k]=analyse(data[k])}));
    const d=data[tf],a=res[tf];
    candles.setData(d);
    l9.setData(d.map((x,i)=>({time:x.time,value:a.e9[i]})).slice(9));
    l21.setData(d.map((x,i)=>({time:x.time,value:a.e21[i]})).slice(21));
    candles.setMarkers(a.marks);
    $('#price').textContent=d[d.length-1].close.toFixed(2);
    const cs=G.map(k=>res[k].call),nb=cs.filter(x=>x==='BUY').length,ns=cs.filter(x=>x==='SELL').length;
    let t='WAIT',txt='Timeframes disagree. Better to stay out.';
    if(nb===3){t='BUY';txt='All 3 timeframes ('+G.join(' / ')+') agree · strong'}
    else if(ns===3){t='SELL';txt='All 3 timeframes ('+G.join(' / ')+') agree · strong'}
    else if(nb===2&&ns===0){t='BUY';txt='2 of 3 timeframes agree · weaker'}
    else if(ns===2&&nb===0){t='SELL';txt='2 of 3 timeframes agree · weaker'}
    $('#call').textContent=t;$('#call').className='big '+t;$('#why1').textContent=txt;
    $('#chips').innerHTML=G.map(k=>`<div class="chip">${k}<b class="${res[k].call}">${res[k].call}</b></div>`).join('');
    $('#why').innerHTML=a.votes.map(v=>`<div class="row"><span>${v.n}</span><b class="${v.v>0?'BUY':v.v<0?'SELL':''}">${v.v>0?'Buy':v.v<0?'Sell':'Neutral'}</b></div>`).join('');
  }catch(e){$('#err').textContent=e.message;$('#call').textContent='No data'}
}
$('#tabs').innerHTML=Object.keys(TF).map(k=>`<button data-k="${k}" class="${k===tf?'on':''}">${k}</button>`).join('');
$('#tabs').onclick=e=>{const k=e.target.dataset.k;if(!k)return;tf=k;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));run()};
run();setInterval(run,60000);
</script></body></html>
